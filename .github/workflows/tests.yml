name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only what the offline tests import. No Ollama, no MySQL, no torch (the one
      # torch test uses importorskip), so this stays fast.
      - run: pip install numpy pytest pytest-asyncio pydantic httpx langchain-core langchain-openai python-dotenv aiomysql
      - run: python -m pytest tests -q --ignore=tests/run_agent_eval.py

  # The query layer against a real MySQL: a real slice of the data is loaded, the precomputed
  # tables are derived by the repository's backfill, and tests/test_db_integration.py checks
  # search, counts, comparisons, overview, hot events, event detail and keyword search.
  db-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: citest
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pcitest"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: citest
      DB_NAME: gdelt
      GDELT_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest pytest-asyncio pydantic httpx langchain-core langchain-openai python-dotenv aiomysql pymysql
      - run: tests/ci_db_setup.sh
      - run: python -m pytest tests/test_db_integration.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
