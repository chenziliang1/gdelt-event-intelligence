name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only what the offline tests import. No Ollama, no MySQL, no torch (the one
      # torch test uses importorskip), so this stays fast.
      - run: pip install numpy pytest pytest-asyncio pydantic httpx langchain-core langchain-openai python-dotenv aiomysql
      - run: python -m pytest tests -q --ignore=tests/run_agent_eval.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
